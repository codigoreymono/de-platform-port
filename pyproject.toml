[project]
name = "nyc311-data-platform"
version = "0.1.0"
requires-python = ">=3.12,<3.13"
dependencies = [
    "boto3>=1.43.113",
    "duckdb>=1.5.6",
    "httpx>=0.28.1",
    "pandas>=3.0.6",
    "pyarrow>=26.0.0",
]

[dependency-groups]
dev = [
    "pytest>=9.1.1",
]
notebooks = [
    "ipykernel>=7.4.0",
    "jupyterlab>=4.6.4",
    "notebook>=7.6.3",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"
[tool.hatch.build.targets.wheel]
packages = ["src/nyc311"]

[tool.ruff]
target-version = "py312"
line-length = 88
src = ["src"]

[tool.ruff.lint]
select = [
    "E4",
    "E7",
    "E9",
    "F",
    "I",
]
